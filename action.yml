name: "Release Gem"
description: "Upload gems to RubyGems.org"
inputs:
  token:
    description: >-
      GitHub token used to authenticate git operations (e.g. pushing the release tag).
      Defaults to the built-in github.token. Override with a PAT or GitHub App token
      when tag push protection rules require a specific actor or bypass permission.
    required: false
    default: ${{ github.token }}
  await-release:
    description: "Whether to poll for the release to be available on RubyGems.org"
    required: false
    default: "true"
  setup-trusted-publisher:
    description: "Whether to setup the trusted publisher for the gem"
    required: false
    default: "true"
  attestations:
    description: >-
      [EXPERIMENTAL]
      Enable experimental support for sigstore attestations.
      Only works with RubyGems.org via Trusted Publishing.
      No effect on RubyGems versions that sign on their own; they attest
      whether or not this is set.
    required: false
    default: "true"
  working-directory:
    description: "The working directory to run the rake tasks in"
    required: false
    default: ""
  tag:
    description: "Create and push a git release tag which is in the form #{prefix}/v#{version}."
    required: false
    default: "true"
  build:
    description: "Build the gem package"
    required: false
    default: "true"
  publish:
    description: "Publish the gem to the configured source"
    required: false
    default: "true"
outputs: {}
branding:
  color: "red"
  icon: "upload-cloud"
runs:
  using: "composite"
  steps:
    - name: Attribute commits to last committer
      run: |
        git config --global user.email "$(git log -1 --pretty=format:'%ae')"
        git config --global user.name "$(git log -1 --pretty=format:'%an')"
      shell: bash
    - name: Configure Git using cached credentials
      run: |
        git credential-cache --timeout=300 store <<EOF
        protocol=https
        host=github.com
        username=x-access-token
        password=${{ inputs.token }}

        EOF
        git config --local credential.helper 'cache --timeout=300'
      shell: bash
    - name: Fetch tags
      run: git fetch --tags --force
      shell: bash
    - name: Configure trusted publishing credentials
      if: ${{ inputs.setup-trusted-publisher == 'true' }}
      uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
    # Use the normal release task when all three phases are enabled.
    - name: Run release rake task
      if: ${{ inputs.tag == 'true' && inputs.build == 'true' && inputs.publish == 'true' }}
      run: bundle exec rake release
      shell: bash
      env:
        RUBYOPT: "${{ inputs.attestations == 'true' && format('-r{0}/rubygems-attestation-patch.rb {1}', github.action_path, env.RUBYOPT) || env.RUBYOPT }}"
      working-directory: ${{ inputs.working-directory }}
    # Otherwise execute the requested phases individually.
    - name: Build gem
      if: ${{ !(inputs.tag == 'true' && inputs.publish == 'true') && inputs.build == 'true' }}
      run: bundle exec rake build
      shell: bash
      env:
        RUBYOPT: "${{ inputs.attestations == 'true' && format('-r{0}/rubygems-attestation-patch.rb {1}', github.action_path, env.RUBYOPT) || env.RUBYOPT }}"
      working-directory: ${{ inputs.working-directory }}
    - name: Create git tag
      if: ${{ !(inputs.build == 'true' && inputs.publish == 'true') && inputs.tag == 'true' }}
      run: bundle exec rake release:source_control_push
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: Publish gem
      if: ${{ !(inputs.tag == 'true' && inputs.build == 'true') && inputs.publish == 'true' }}
      run: bundle exec rake release:rubygem_push
      shell: bash
      env:
        RUBYOPT: "${{ inputs.attestations == 'true' && format('-r{0}/rubygems-attestation-patch.rb {1}', github.action_path, env.RUBYOPT) || env.RUBYOPT }}"
      working-directory: ${{ inputs.working-directory }}
    - name: Wait for release to propagate
      if: ${{ inputs.await-release == 'true' && inputs.publish == 'true' }}
      run: gem exec rubygems-await pkg/*.gem
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: Clean up credentials
      if: always()
      run: git credential-cache exit || true
      shell: bash
